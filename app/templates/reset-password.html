<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - LinkHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    #eef2ff 0%,
                    #f8fafc 45%,
                    #eef2ff 100%
                );
            color: #0f172a;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            width: 100%;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid #e2e8f0;
        }

        .brand {
            text-decoration: none;
            font-size: 24px;
            font-weight: 800;
            color: #111827;
        }

        .brand span {
            color: #6366f1;
        }

        .back-login {
            text-decoration: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            color: #4f46e5;
        }

        .page {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 42px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.12);
        }

        .logo-circle {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #6366f1;
            color: white;
            font-size: 20px;
            font-weight: 800;
        }

        .reset-card h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            outline: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .reset-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .reset-button:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        #message {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .login-text {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .login-text a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 700;
        }

        .login-text a:hover {
            color: #4f46e5;
        }

        footer {
            padding: 22px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 500px) {

            .navbar {
                padding: 18px 5%;
            }

            .brand {
                font-size: 20px;
            }

            .page {
                padding: 30px 16px;
            }

            .reset-card {
                padding: 30px 22px;
            }

        }

    </style>

</head>

<body>

    <nav class="navbar">

        <a href="/" class="brand">
            Link<span>Hub</span>
        </a>

        <a href="/login" class="back-login">
            ← Back to Login
        </a>

    </nav>


    <main class="page">

        <div class="reset-card">

            <div class="logo-circle">
                LH
            </div>

            <h1>Create a new password</h1>

            <p class="subtitle">
                Choose a strong password to secure your LinkHub account.
            </p>


            <form id="resetForm">

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="reset-button"
                >
                    Reset Password
                </button>

            </form>


            <p id="message"></p>


            <div class="login-text">

                Remember your password?
                <a href="/login">
                    Back to Login
                </a>

            </div>

        </div>

    </main>


    <footer>
        © 2026 LinkHub. Branded links made simple.
    </footer>


    <script src="/static/js/reset-password.js"></script>

</body>

</html>
