<!DOCTYPE html>
<html>
<head>
    <title>Register - Branded Link Hub</title>
</head>
<body>

<h2>Create Account</h2>

<form id="registerForm">

    <input
        type="text"
        id="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<p id="message"></p>

<div id="verification"></div>

<script src="/static/js/register.js"></script>

</body>
</html>
