<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>
</head>

<body>

<h2>Forgot Password</h2>

<form id="forgotForm">

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <br><br>

    <button type="submit">
        Generate Reset Link
    </button>

</form>


<p id="message"></p>

<div id="resetLink"></div>


<script src="/static/js/forgot-password.js"></script>

</body>

</html>
