<!DOCTYPE html>
<html>
    <head>
    <title>Dashboard - Branded Link Hub</title>

    <style>
        .analytics-chart {
            margin: 15px 0;
        }

        .analytics-row {
            margin-bottom: 12px;
        }

        .analytics-label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .analytics-bar-container {
            width: 100%;
            height: 22px;
            background: #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
        }

        .analytics-bar {
            height: 100%;
            background: #667eea;
            border-radius: 6px;
            min-width: 2px;
        }

        .analytics-value {
            margin-top: 3px;
            font-size: 14px;
        }
    </style>
    </head>
<body>

<h1>Dashboard</h1>

<h3>Your Short Links</h3>

<div>

    <input
        type="text"
        id="search"
        placeholder="Search links..."
    >

    <button
        id="searchButton"
        type="button"
    >
        Search
    </button>

</div>

<br>


<h3>Profile Customization</h3>

<label for="avatar">
    Profile Avatar
</label>

<br>

<input
    type="file"
    id="avatar"
    accept=".png,.jpg,.jpeg,.webp"
>

<br><br>

<button
    id="uploadAvatar"
    type="button"
>
    Upload Avatar
</button>

<p id="avatarMessage"></p>

<br>


<input
    type="text"
    id="displayName"
    placeholder="Display Name"
>

<br><br>

<textarea
    id="bio"
    placeholder="Bio"
    rows="4"
    cols="40"
></textarea>

<br><br>

<button
    id="saveProfile"
    type="button"
>
    Save Profile
</button>

<p id="profileMessage"></p>

<br>


<h3>Social Links</h3>

<input
    type="text"
    id="socialPlatform"
    placeholder="Platform (e.g. Instagram)"
>

<br><br>

<input
    type="url"
    id="socialUrl"
    placeholder="Social URL"
>

<br><br>

<button
    id="addSocialLink"
    type="button"
>
    Add Social Link
</button>

<p id="socialMessage"></p>

<div id="socialLinks">
    Loading...
</div>

<br>

<h3>Bio Profile Theme</h3>

<select id="theme">
    <option value="minimal-light">Minimal Light</option>
    <option value="dark-slate">Dark Slate</option>
    <option value="gradient">Gradient</option>
</select>

<button
    id="saveTheme"
    type="button"
>
    Save Theme
</button>

<p id="themeMessage"></p>


<h3>Create New Link</h3>

<form id="createLinkForm">

<input 
type="text"
id="title"
placeholder="Title">

<br><br>

<input 
type="text"
id="original_url"
placeholder="Original URL"
required>

<br><br>

<input 
type="text"
id="custom_slug"
placeholder="Custom Slug">

<br><br>

<button type="submit">
Create Link
</button>

</form>

<p id="createMessage"></p>

<div id="links">
    Loading...
</div>

<div id="pagination">

    <button
        id="previousPage"
        type="button"
    >
        Previous
    </button>

    <span id="pageInfo">
        Page 1
    </span>

    <button
        id="nextPage"
        type="button"
    >
        Next
    </button>

</div>

<div id="analytics" style="display:none;">

    <h3>Link Analytics</h3>

    <p id="totalClicks"></p>
    <p id="uniqueVisitors"></p>

    <h4>Device Distribution</h4>
    <div id="devices"></div>

    <h4>Top Referrers</h4>
    <div id="referrers"></div>

    <h4>Clicks Over Time</h4>
    <div id="clicksOverTime"></div>

</div>


<button id="logout">
    Logout
</button>


<script src="/static/js/dashboard.js"></script>

</body>
</html>
