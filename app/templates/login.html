<!DOCTYPE html>
<html>
<head>
    <title>Login - Branded Link Hub</title>
</head>

<body>

<h2>Login</h2>

<form id="loginForm">

    <input 
        type="text" 
        id="identifier" 
        placeholder="Username or Email"
        required
    >

    <br><br>

    <input 
        type="password" 
        id="password" 
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<p id="message"></p>


<script src="/static/js/login.js"></script>

</body>
</html>
